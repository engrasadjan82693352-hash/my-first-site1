<!DOCTYPE html>
<html>
<head>
    <title>My First Website</title>
    <style>
        body {
            background-color: #f0f8ff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            scroll-behavior: smooth; /* makes scrolling smooth */
        }

        /* MENU STYLE */
        nav {
            background-color: #0066cc;
            padding: 10px;
            border-radius: 10px;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }
        nav a:hover {
            text-decoration: underline;
        }

        h1 {
            color: #0066cc;
        }

        img {
            width: 80%;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* NEW SECTIONS */
        section {
            margin-top: 50px;
            padding: 30px;
            background-color: white;
            border-radius: 15px;
        }
    </style>
</head>
<body>

    <!-- MENU -->
    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </nav>

    <!-- HOME SECTION -->
    <section id="home">
        <h1>Welcome to My Website</h1>
        <p>This is my first paragraph.</p>
        <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=800" alt="Mountain">
    </section>

    <!-- ABOUT SECTION -->
    <section id="about">
        <h1>About Me</h1>
        <p>Hello! My name is Asad. This is my first website. I am learning HTML and CSS with Github.</p>
    </section>

    <!-- CONTACT SECTION -->
    <section id="contact">
        <h1>Contact</h1>
        <p>You can email me at: myemail@example.com</p>
        <p>I live in Ras Al Khaimah, UAE 🇦🇪</p>
    </section>

</body>
</html>
