<!DOCTYPE html>
<html>
<head>
    <title>My First Website</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            text-align: center;
            padding: 20px;
        }
        h1 {
            color: blue;
        }
        p {
            color: green;
        }
        img {
            border-radius: 10px;
            max-width: 100%;
            height: auto;
        }
        a {
            background-color: orange;
            color: white;
            padding: 10px;
            border-radius: 5px;
        }
        a:hover {
            background-color: green;
        }
        nav {
            background-color: #333;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
        }
        nav a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<nav>
    <a href="#home">Home</a>
    <a href="#about">About</a>
    <a href="#contact">Contact</a>
</nav>

</html>
